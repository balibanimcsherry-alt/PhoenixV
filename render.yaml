services:
  - type: web
    name: coastal-haven
    runtime: docker
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: coastal-haven-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_API_URL
        value: ""
      - key: FRONTEND_URL
        value: https://coastal-haven.onrender.com
      - key: STRIPE_MODE
        value: test
      - key: STRIPE_TEST_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_TEST_SECRET_KEY
        sync: false
      - key: STRIPE_LIVE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_LIVE_SECRET_KEY
        sync: false
      - key: STRIPE_SUCCESS_URL
        value: https://coastal-haven.onrender.com/book?success=1
      - key: STRIPE_CANCEL_URL
        value: https://coastal-haven.onrender.com/book?cancelled=1
      - key: AIRBNB_ICAL_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        value: Coastal Haven at Phoenix V
      - key: CALENDAR_TOKEN
        value: coastal-haven-cal-feed
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: coastal-haven-db
    databaseName: coastal_haven
    plan: free
