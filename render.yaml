services:
  - type: web
    name: coastal-haven
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && npm ci && npm run build
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coastal-haven-db
          property: connectionString

databases:
  - name: coastal-haven-db
    plan: free
