services:
  - type: web
    name: coastal-haven
    runtime: python
    plan: starter
    # Frontend is prebuilt and committed to dist/ (rebuild locally with `npm run build` before pushing).
    # Serving the committed dist avoids flaky/slow Node builds on the starter plan.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
